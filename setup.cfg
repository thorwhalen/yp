[metadata]
name = yp
version = 0.0.11
url = https://github.com/thorwhalen/yp
platforms = any
description_file = README.md
root_url = https://github.com/thorwhalen/
license = apache-2.0
author = Thor Whalen
description = A mapping view to pypi projects
long_description = file:README.md
long_description_content_type = text/markdown
keywords = 
display_name = yp

[options]
packages = find:
include_package_data = True
zip_safe = False
install_requires = 
	bs4
	requests
	dol
	lxml
	pipdeptree
	packaging
	config2py

# Without this, nothing under yp/data ships: include_package_data alone only picks up
# what MANIFEST.in names, and there was no MANIFEST.in. The result was a 15KB wheel
# with no pkg_list at all, so `import yp` raised ImportError for every user.
# pkg_list.txt is deliberately NOT shipped: it duplicates pkg_list.tsv.gz at 3x the size.
[options.package_data]
yp =
	data/pkg_list.tsv.gz
	data/skills/*/SKILL.md
